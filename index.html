    <script>
        // Real-time Countdown Timer (14 mins 44 secs decrementing)
        let totalSeconds = 14 * 60 + 44;
        const countdownEl = document.getElementById('countdown');

        function updateCountdown() {
            if (totalSeconds <= 0) {
                totalSeconds = 15 * 60; // reset loop
            }
            totalSeconds--;

            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;

            const formattedMin = String(minutes).padStart(2, '0');
            const formattedSec = String(seconds).padStart(2, '0');

            countdownEl.textContent = `${formattedMin}:${formattedSec}`;
        }
        setInterval(updateCountdown, 1000);

        // Minor dynamic fluctuation in active members count for realistic feel
        const memberCountEl = document.getElementById('memberCounter');
        let currentMembers = 70311;
        setInterval(() => {
            const delta = Math.floor(Math.random() * 5) - 2; // -2 to +2
            currentMembers = Math.max(70300, currentMembers + delta);
            memberCountEl.textContent = currentMembers.toLocaleString('en-US') + '+';
        }, 3500);

        // Start the APK request first, then record the initiation event.
        // A browser page cannot confirm that the user completed the full download.
        function trackApkDownload(event, link) {
            event.preventDefault();
            const destination = link.href;
            const notice = document.getElementById('downloadNotice');

            if (notice) {
                notice.classList.remove('hidden');
                notice.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Starting APK download...';
            }

            // Open the APK URL synchronously from the user gesture so the request starts
            // before the Pixel event is sent, while keeping this landing page open.
            const downloadTab = window.open(destination, '_blank');
            if (downloadTab) {
                if (typeof window.fbq === 'function') {
                    fbq('trackCustom', 'Download');
                }
            } else {
                // Popup blockers may prevent a new tab; fall back to same-tab navigation.
                // Do not send the event here because navigation can prevent it from being sent.
                window.location.href = destination;
            }
        }

        // The download button links directly to the real APK hosted in this repository.
    </script>
